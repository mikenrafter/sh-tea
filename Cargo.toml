[package]
name = "tea"
version = "0.1.0"
edition = "2021"
description = "Transparent pipeline stage logger for stdin→stdout filters"
license = "MIT"

[[bin]]
name = "tea"
path = "src/bin/tea.rs"

[[bin]]
name = "tea-wrap"
path = "src/bin/tea_wrap.rs"

[dependencies]
csv = "1.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
